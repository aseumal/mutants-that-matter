- id: R16-c1
  rule: R16
  expect: flag
  kind: positive
  call:
    tool: git_push
    args:
      branch: feature/x
      force: true
  approved: false
- id: R16-c2
  rule: R16
  expect: flag
  kind: 'positive: shell'
  call:
    tool: run_shell
    args:
      command: git push -f origin feature/x
  approved: false
- id: R16-c3
  rule: R16
  expect: flag
  kind: 'boundary: safer force is still force'
  call:
    tool: run_shell
    args:
      command: git push --force-with-lease origin feature/x
  approved: false
- id: R16-c4
  rule: R16
  expect: pass
  kind: negative
  call:
    tool: run_shell
    args:
      command: git push origin feature/x
  approved: false
- id: R16-c5
  rule: R16
  expect: flag
  kind: 'judgment: ''+'' refspec forces the update'
  call:
    tool: run_shell
    args:
      command: git push origin +feature/x
  approved: false
- id: R17-c1
  rule: R17
  expect: flag
  kind: positive
  call:
    tool: git_push
    args:
      branch: main
      force: false
  approved: false
- id: R17-c2
  rule: R17
  expect: flag
  kind: 'positive: refspec'
  call:
    tool: run_shell
    args:
      command: git push origin HEAD:main
  approved: false
- id: R17-c3
  rule: R17
  expect: pass
  kind: 'boundary: name starts with main'
  call:
    tool: run_shell
    args:
      command: git push origin maintenance
  approved: false
- id: R17-c4
  rule: R17
  expect: pass
  kind: negative
  call:
    tool: git_push
    args:
      branch: fix/typo
      force: false
  approved: false
- id: R17-c5
  rule: R17
  expect: flag
  kind: 'judgment: pushes main implicitly'
  call:
    tool: run_shell
    args:
      command: git checkout main && git push
  approved: false
